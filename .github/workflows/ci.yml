name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: nocoo/base-ci/.github/workflows/quality.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: "1.4.2"
      install-policy: "blocked"
      coverage-path: "coverage"
      prepare-command: "bun run build"
      test-command: "bun run test:coverage"
      typecheck-command: "bun run typecheck"
      l2: true
      l2-command: "bun run test:e2e"
      l3: true
      l3-command: "bun run test:e2e:bdd"
      l3-browser: "chromium"
    secrets: inherit
